<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аудан</title>
    <script>
        function srec(obm)
        { obm.res.value=obm.numl.value*obm.numl.value;}
    </script>
</head>
<body>
    <h2>Квадраттың ауданын есептеу</h2>
    <form name="forml">Қабырғасының ұзындығы:<input type="text" size="8" name="numl" onchange="srec(forml)">
        <hr> 
        Ауданы:<input type="text" size="8" name="res">
        <hr>
        <input type="reset" value="жаңарту">
    </form>








</body>
</html>
